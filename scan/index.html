  const splash = t=>{ const x = $("#fpSplashTx"); if(x) x.textContent = t; };
  const unsplash = ()=>{ const s = $("#fpSplash"); if(s){ s.classList.add("out"); setTimeout(()=> s.remove(), 300); } };
  const ls = { g:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, s:(k, v)=>{ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} } };
  function load(src){ return new Promise((res, rej)=>{ const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  async function sdk(){
    for(const b of BASES){ try{ await load(b + "firebase-app-compat.js"); await Promise.all([load(b + "firebase-auth-compat.js"), load(b + "firebase-firestore-compat.js")]); if(window.firebase && firebase.firestore && firebase.auth) return true; }catch(e){} }
    return false;
  }
  /* a QR-kódból (…/scan/#c=kód) vagy beírt kódból: jelszó nélküli belépés */
  const codeOf = v=> String(v || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  async function redeem(code){
    const r = await fetch("/api/qr", { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify({ action:"redeem", code }) });
    const j = await r.json().catch(()=> ({})); if(!r.ok || !j.ok) throw new Error(j.error || ("Hiba (" + r.status + ")"));
    const cur = firebase.auth().currentUser;
    if(!cur || cur.email !== j.email) await firebase.auth().signInWithCustomToken(j.token);
    ls.s("fp_scan_t", j.t || ""); return j;
  }
  const toEmail = v=>{ v = String(v || "").trim(); if(v.includes("@")) return v.toLowerCase(); const n = v.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9._-]/g, ""); if(!n) return ""; if(n === "admin") return "admin@admin.com";
    try{ const L = window.fpLoginFor && fpLoginFor(n); if(L) return L + "@firstphone.hu"; }catch(e){} return n + "@firstphone.hu"; };
  const shopOf = email=>{ try{ const st = window.fpStoreFromEmail && fpStoreFromEmail(email); if(st) return st.label || ("FirstPhone " + st.location); }catch(e){} return String(email || "").split("@")[0]; };
  function loginForm(msg){
    unsplash(); let L = $("#fcLogin"); if(L) L.remove();
    L = document.createElement("div"); L.id = "fcLogin";
    L.innerHTML = `<div class="lg"><div class="hd"><img src="/scan/icon-180.png" alt=""><div><b>FirstPhone Fotó</b><small>Lefotózod → a bolt gépén azonnal megjelenik</small></div></div>
      <div class="card"><h2>📱 Belépés a gép kódjával</h2><p>A bolt gépén nyisd meg a <b>📷 Fotók</b> ablakot, és olvasd be a <b>QR-kódot</b> a telefon kamerájával — vagy írd be ide az alatta lévő kódot:</p>
        <input class="code" id="scCode" inputmode="text" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" placeholder="pl. abcde-fghjk" maxlength="14">
        <button type="button" class="go" id="scCodeGo">Belépés kóddal →</button></div>
      <div class="or">— vagy —</div>
      <div class="card"><h2>🔑 Bolt neve és jelszó</h2><form id="scPw" autocomplete="on"><label for="scName">Bolt neve</label><input id="scName" name="username" autocomplete="username" placeholder="pl. Kaposvár, Eger" autocapitalize="words">
        <label for="scPass">Jelszó</label><input id="scPass" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
        <button type="submit" class="go sec" id="scPwGo">Belépés →</button></form></div>
      <div class="err" id="scErr">${E(msg || "")}</div><div class="ft">FirstPhone Munkaasztal · Fotó</div></div>`;
    document.body.appendChild(L);
    const err = t=>{ $("#scErr").textContent = t || ""; };
    $("#scCodeGo").onclick = async ()=>{ const c = codeOf($("#scCode").value); if(c.length !== 10){ err("A kód 10 karakter (pl. abcde-fghjk)."); return; } const b = $("#scCodeGo"); b.disabled = true; b.textContent = "Belépés…"; err("");
      try{ await redeem(c); }catch(e){ err(e.message || String(e)); } b.disabled = false; b.textContent = "Belépés kóddal →"; };
    $("#scCode").addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); $("#scCodeGo").click(); } });
    $("#scPw").onsubmit = async e=>{ e.preventDefault(); const em = toEmail($("#scName").value), pw = $("#scPass").value; if(!em || !pw){ err("Írd be a bolt nevét és a jelszót."); return; }
      const b = $("#scPwGo"); b.disabled = true; b.textContent = "Belépés…"; err("");
      try{ ls.s("fp_scan_t", null); await firebase.auth().signInWithEmailAndPassword(em, pw); }
      catch(x){ err(/wrong-password|invalid-credential|invalid-login|user-not-found/.test(x && x.code || "") ? "Hibás bolt név vagy jelszó." : /network/.test(x && x.code || "") ? "Nincs internet — próbáld újra." : (x.message || String(x))); }
      b.disabled = false; b.textContent = "Belépés →"; };
  }
  let started = false;
  function go(u){
    const L = $("#fcLogin"); if(L) L.remove();
    const adm = u.email === "admin@admin.com";
    const t = ls.g("fp_scan_t") || (adm ? "" : u.uid);
    if(!t){ loginForm("Adminnal: a gépen nyisd meg annál a boltnál a 📷 Fotókat, és olvasd be onnan a QR-kódot."); return; }
    window.fpScanShop = adm ? "Admin" : shopOf(u.email);
    window.FP_CLOUD = { on:true, user:u, db:firebase.firestore(), target:t, admin:adm };
    window.fpScanLogout = async ()=>{ ls.s("fp_scan_t", null); try{ await firebase.auth().signOut(); }catch(e){} location.replace("/scan/"); };
    if(started) return; started = true;
    /* 🤖 hibanapló → az admin a 🐞 Hibajegyeknél látja (ugyanúgy, mint a Munkaasztalnál) */
    window.__fpErrFlush = async ()=>{ const Q = window.__fpErrQ || []; while(Q.length){ const x = Q.shift(); let h = 5381; const k = x.m + "|" + x.src + "|" + window.FP_BUILD; for(let i = 0; i < k.length; i++) h = ((h << 5) + h + k.charCodeAt(i)) >>> 0;
        try{ const FV = firebase.firestore.FieldValue; await firebase.firestore().collection("boltok").doc(t).collection("err").doc("e" + h.toString(36)).set({ m:x.m, src:x.src, st:x.st, pg:"foto-app", w:x.w, b:window.FP_BUILD || "", ua:(navigator.userAgent || "").slice(0, 90), last:x.at, first:x.at, n:FV && FV.increment ? FV.increment(1) : 1 }, { merge:true }); }catch(e){} } };
    if(!adm) setTimeout(()=> window.__fpErrFlush(), 2000);
    unsplash(); try{ window.fpScanInit(); }catch(e){ toast("⚠ " + (e.message || e)); }
  }
  async function boot(){
    splash("Kapcsolódás…");
    if(!(await sdk())){ splash("Nincs internet — a fotózáshoz kapcsolat kell. Próbáld újra."); setTimeout(()=> location.reload(), 6000); return; }
    firebase.initializeApp(CFG);
    const m = /[#&]c=([a-z0-9-]{10,14})/i.exec(location.hash || "");
    if(m){ try{ history.replaceState(null, "", location.pathname); }catch(e){} }
    let first = true;
    firebase.auth().onAuthStateChanged(async u=>{
      if(first){ first = false;
        if(m){ splash("Belépés a QR-kóddal…"); try{ const j = await redeem(codeOf(m[1])); const cu = firebase.auth().currentUser; if(cu && cu.email === j.email) go(cu); return; }catch(e){ if(!u){ loginForm(e.message || String(e)); return; } toast("⚠ " + (e.message || e)); } } }
      if(u) go(u); else if(!started) loginForm("");
      else location.replace("/scan/");
    });
  }
  boot();
})();
</script>
</body>
</html>
